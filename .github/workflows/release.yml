name: Release

on:
  push:
    tags:
      - 'v*.*.*-release'
      - 'v*.*.*-master'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit libglew-dev libglfw3-dev \
            libcurl4-openssl-dev nlohmann-json3-dev libssl-dev

      - name: Build
        run: |
          cmake -S ProjectSource -B build -DCMAKE_BUILD_TYPE=Release \
                -DGIT_TAG="${GITHUB_REF_NAME}" -DCUDA_ARCH_LIST="60;70;75;80;86;89"
          cmake --build build -j "$(nproc)"

      - name: Package
        run: |
          mkdir -p package/UpdateLoader/scripts
          cp build/executables build/version.info package/
          cp ProjectSource/UpdateLoader/scripts/update.sh package/UpdateLoader/scripts/
          tar czf "lbm-linux-Release-${GITHUB_REF_NAME}.tar.gz" -C package .
          cp "lbm-linux-Release-${GITHUB_REF_NAME}.tar.gz" lbm-linux-latest.tar.gz
          sha256sum lbm-linux-*.tar.gz | tee SHA256SUMS

      # GitHub also publishes a sha256 digest for every asset; the self-updater
      # verifies lbm-linux-latest.tar.gz against it. SHA256SUMS is for humans.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lbm-linux-Release-${{ github.ref_name }}.tar.gz
            lbm-linux-latest.tar.gz
            SHA256SUMS
